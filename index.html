<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }
  #msg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font: 16px/1.4 system-ui, sans-serif;
    text-align: center;
    padding: 2rem;
    white-space: pre-line;
  }
</style>
</head>
<body>
<div id="msg">Click anywhere to start ▶</div>
<video id="v" playsinline muted></video>

<script>
// Folder that holds the videos, relative to this HTML file.
const DIR = "kasper-demo-videos/";

// The video files, in the order they should play. Sorted alphabetically.
const FILES = [
  "kasper-demo-1-tour.webm",
  "kasper-demo-2-who-pays.webm",
  "kasper-demo-3-plain-to-ticket.webm",
  "kasper-demo-4-any-repository.webm",
  "kasper-demo-5-off-and-unsent.webm",
  "kasper-demo-6-receipts.webm",
].sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));

const video = document.getElementById("v");
const msg = document.getElementById("msg");
let idx = 0;

function playCurrent() {
  video.src = DIR + encodeURIComponent(FILES[idx]);
  video.play().catch(() => {});
}
function next() {
  idx = (idx + 1) % FILES.length; // loop
  playCurrent();
}

video.addEventListener("ended", next);
video.addEventListener("error", next); // skip anything that won't play

function start() {
  msg.style.display = "none";
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  video.muted = false;
  playCurrent();
}
document.addEventListener("click", start, { once: true });
document.addEventListener("keydown", start, { once: true });
</script>
</body>
</html>
